apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossplane-plan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crossplane-plan.labels" . | nindent 4 }}
  {{- with include "crossplane-plan.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # HA-ready: leader election ensures only one replica processes events
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "crossplane-plan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crossplane-plan.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "crossplane-plan.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Main container: crossplane-plan (listed first as default for kubectl logs)
        - name: crossplane-plan
          image: {{ include "crossplane-plan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
            - name: config
              mountPath: /etc/crossplane-plan
              readOnly: true
          args:
            - --detection-strategy=$(DETECTION_STRATEGY)
            - --name-pattern=$(NAME_PATTERN)
            - --vcs-provider=$(VCS_PROVIDER)
            - --vcs-github-repository=$(VCS_GITHUB_REPOSITORY)
            - --vcs-azure-organization=$(VCS_AZURE_ORGANIZATION)
            - --vcs-azure-project-id=$(VCS_AZURE_PROJECT_ID)
            - --vcs-azure-repository-id=$(VCS_AZURE_REPOSITORY_ID)
            - --vcs-azure-auth-mode=$(VCS_AZURE_AUTH_MODE)
            - --output-format=$(OUTPUT_FORMAT)
          env:
            # Pod identity for leader election
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Detection configuration
            - name: DETECTION_STRATEGY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: detection-strategy
            - name: NAME_PATTERN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: name-pattern
            - name: VCS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-provider
            - name: VCS_GITHUB_REPOSITORY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-github-repository
            - name: VCS_AZURE_ORGANIZATION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-azure-organization
            - name: VCS_AZURE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-azure-project-id
            - name: VCS_AZURE_REPOSITORY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-azure-repository-id
            - name: VCS_AZURE_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: vcs-azure-auth-mode
            - name: OUTPUT_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "crossplane-plan.configMapName" . }}
                  key: output-format

            {{- if eq .Values.vcs.provider "github" }}
            # GitHub authentication (uses same Secret as crossplane-provider-github)
            - name: GITHUB_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcs.github.credentialsSecretName }}
                  key: {{ .Values.vcs.github.credentialsSecretKey }}
            {{- else if and (eq .Values.vcs.provider "azure-repos") (eq .Values.vcs.azureRepos.auth.mode "pat") }}
            # PAT mode is local/emergency only; production should use workload identity.
            - name: AZURE_DEVOPS_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcs.azureRepos.auth.tokenSecretRef.name }}
                  key: {{ .Values.vcs.azureRepos.auth.tokenSecretRef.key }}
            {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        # KubeDock sidecar: emulates Docker API for Crossplane function execution
        - name: kubedock
          image: {{ include "crossplane-plan.kubedockImage" . }}
          imagePullPolicy: {{ .Values.kubedock.image.pullPolicy }}
          args:
            - server
            - --unix-socket
            - /var/run/docker.sock
            - --reverse-proxy
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
          {{- with .Values.kubedock.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.kubedock.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        # Shared volume for docker.sock emulation by kubedock
        - name: docker-sock
          emptyDir: {}

        # Config volume for field stripping rules
        - name: config
          configMap:
            name: {{ include "crossplane-plan.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
