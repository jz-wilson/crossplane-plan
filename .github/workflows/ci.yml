name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        uses: ./.github/actions/earthly-build
        with:
          earthly-target: '+all'
          push: 'false'

      - name: Build Summary
        if: success()
        run: |
          echo "crossplane-plan built and tested successfully"
          echo "- All tests passed"
          echo "- Linting passed"
          echo "- Binary built"
