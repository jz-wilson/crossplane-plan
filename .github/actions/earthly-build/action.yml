name: Build crossplane-plan
description: Build and test crossplane-plan using Earthly
inputs:
  earthly-target:
    description: 'Earthly target to build (e.g., +all, +publish)'
    required: false
    default: '+all'
  push:
    description: 'Whether to push images (adds --push flag)'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing the Earthfile (defaults to tools/crossplane-plan in mill, . in FOSS)'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64

    - name: Download Earthly
      shell: bash
      run: |
        wget https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64 -O /usr/local/bin/earthly
        chmod +x /usr/local/bin/earthly
        earthly --version

    - name: Build with Earthly
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORCE_COLOR: 1
      run: |
        PUSH_FLAG=""
        CACHE_FLAGS="--remote-cache=ghcr.io/millstonehq/cache:crossplane-plan --max-remote-cache"

        if [ "${{ inputs.push }}" == "true" ]; then
          PUSH_FLAG="--push"
        fi

        earthly --ci $PUSH_FLAG $CACHE_FLAGS ${{ inputs.earthly-target }}
